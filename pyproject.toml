[project]
name = "jwrag"
version = "0.1.0"
description = "JWRAG: Judgment-Weighted Retrieval-Augmented Generation"
requires-python = ">=3.12"
dependencies = [
    "watchdog",
    "pypdf",
    "httpx",
    "loguru",
    "numpy",
    "python-dotenv>=1.2.2",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.363",
    "spacy>=3.8.14",
    "openai>=2.46.0",
    "click>=8.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
]
